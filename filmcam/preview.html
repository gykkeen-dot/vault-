<title>FilmCam Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: screen and buttons are pinned on top, sliders scroll beneath */
:root{--bg1:#e6eaed;--panel:#f8f9fa;--white:#fff;--line:#c4cacf;--ink:#1b1f23;--mute:#6f7880;--signal:#00c8ff;--signal-ink:#0086c3;--glow:rgba(0,200,255,.55);--ok:#2fbf71;--screen:#050607;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;color-scheme:light}
body{background:var(--bg1);color:var(--ink);font:13px/1.35 var(--mono);padding-block:0 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg1);z-index:10}
.wrap{max-width:720px;margin:0 auto}
.dock{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg1);padding:8px 0 12px}
.hud{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding:0 2px 10px}
.hud b{font:600 15px var(--cond);letter-spacing:.22em;color:var(--ink)}
.led{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok);margin-right:8px}
.seg{display:flex;gap:2px;padding:2px;background:#e3e7ea;border-radius:8px;box-shadow:inset 0 1px 2px rgba(0,0,0,.14);margin-top:12px}
.seg button{flex:1;min-width:0;height:30px;padding:0 10px;border:0;border-radius:6px;background:transparent;font:10px var(--mono);letter-spacing:.12em;color:#2b3238;cursor:pointer}
.seg button.on{background:var(--white);color:var(--signal-ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.25),inset 0 -2px 0 var(--signal),0 0 8px var(--glow)}
.maskrow{display:flex;gap:14px;flex-wrap:wrap;grid-column:1/-1}
.maskrow .seg{margin-top:4px}.g{display:flex;flex-direction:column}.lab{font-size:9px;letter-spacing:.18em;color:var(--mute);text-transform:uppercase}
.ring{position:absolute;border:2px solid var(--signal);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 8px var(--glow)}
.frame{position:relative;background:var(--screen);border-radius:10px;overflow:hidden;display:flex;justify-content:center;width:fit-content;max-width:100%;box-shadow:0 0 0 6px var(--panel),0 0 0 7px var(--line),0 8px 22px rgba(30,40,50,.18);margin:0 6px}
canvas{max-width:100%;max-height:42vh;display:block}
.cn{position:absolute;width:16px;height:16px;border:0 solid var(--signal);pointer-events:none}
.tl{top:8px;left:8px;border-top-width:2px;border-left-width:2px}.tr{top:8px;right:8px;border-top-width:2px;border-right-width:2px}
.bl{bottom:8px;left:8px;border-bottom-width:2px;border-left-width:2px}.br{bottom:8px;right:8px;border-bottom-width:2px;border-right-width:2px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.btn{background:var(--signal);color:#03202b;border:0;border-radius:8px;padding:10px 16px;font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 14px var(--glow)}
button.ghost{background:var(--white);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font:11px var(--mono);letter-spacing:.14em;cursor:pointer}
.tg{display:flex;gap:6px;align-items:center;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.tg input{accent-color:var(--signal)}
button:focus-visible,input:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.hint{color:var(--mute);font-size:11px;letter-spacing:.04em;margin:0 0 12px}
.panel{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px 28px}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.row .v{text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:#cfd5d9}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#cfd5d9}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:22px;margin-top:-9px;border-radius:3px;background:var(--white);border:1px solid #98a1a8;box-shadow:0 1px 2px rgba(0,0,0,.3),inset 0 -3px 0 var(--signal),0 0 6px var(--glow)}
input[type=range]::-moz-range-thumb{width:12px;height:20px;border-radius:3px;background:var(--white);border:1px solid #98a1a8;box-shadow:0 1px 2px rgba(0,0,0,.3),inset 0 -3px 0 var(--signal),0 0 6px var(--glow)}
#file{display:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--white);border-radius:8px;padding:7px 10px;font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);cursor:pointer}
.chip.on{border-color:var(--signal);color:var(--signal-ink);font-weight:600;box-shadow:0 0 8px var(--glow)}
.chips .sep{flex:none;align-self:center;font-size:9px;letter-spacing:.18em;color:var(--mute);text-transform:uppercase;padding:0 2px 0 6px}
</style>

<div class="wrap">
  <div class="dock">
    <div class="hud"><span><i class="led"></i><b>FILMCAM</b></span><span>Effects preview</span></div>
    <div class="frame"><canvas id="c"></canvas><i class="cn tl"></i><i class="cn tr"></i><i class="cn bl"></i><i class="cn br"></i></div>

  </div>
  <div class="panel" id="sliders"></div>
</div>
<script>
// FilmCam shader: one pass for every effect. Shared by the app (ES module)
// and the Artifact preview (tools/build_preview.py inlines this file).

const VERT = `#version 300 es
in vec2 aPos;
out vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.,1.); }`;

const FRAG = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 outColor;
uniform sampler2D uTex;
uniform sampler2D uNoise;
uniform sampler2D uMask;  // painted mask: 1 = effect, 0 = original
uniform vec2 uTexel;      // 1/video size
uniform vec2 uRes;        // canvas size
uniform vec2 uGrainOff;   // grain offset per frame
uniform vec2 uCrop;       // fraction of the source frame (aspect + zoom)
uniform float uMirror;    // 1 = mirror (front camera)
uniform float uTime;      // seconds
uniform float uEffect;    // effect number, 0 = none
uniform float uMaskOn;    // 1 = use uMask
uniform float uIntensity, uContrast, uBrightness, uSaturation, uTemperature, uTint;
uniform float uHighlights, uShadows, uSharpness, uBlur, uGrain, uGrainSize, uVignette, uFade;

const float PI = 3.14159265;

float luma(vec3 c){ return dot(c, vec3(0.2126, 0.7152, 0.0722)); }
vec3 satur(vec3 c, float s){ return mix(vec3(luma(c)), c, s); }
float nz(float s){ return texture(uNoise, vUv * uRes / 256.0 * s + uGrainOff).r; }
float rad(){ return length((vUv - 0.5) * vec2(uRes.x / uRes.y, 1.0)); }
mat2 rot(float a){ float s = sin(a), c = cos(a); return mat2(c, -s, s, c); }
float hash21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
vec2 hash22(vec2 p){ return fract(sin(vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)))) * 43758.5453); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash21(i), hash21(i + vec2(1.0, 0.0)), f.x), mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), f.x), f.y);
}
vec3 pal(float t){ return 0.5 + 0.5 * cos(6.28318 * (t + vec3(0.0, 0.33, 0.67))); }
vec3 hueRot(vec3 c, float a){
  vec3 k = vec3(0.57735);
  return c * cos(a) + cross(k, c) * sin(a) + k * dot(k, c) * (1.0 - cos(a));
}
vec3 heat(float t){
  vec3 r = mix(vec3(0.0, 0.0, 0.08), vec3(0.32, 0.0, 0.55), smoothstep(0.0, 0.25, t));
  r = mix(r, vec3(0.92, 0.18, 0.10), smoothstep(0.25, 0.5, t));
  r = mix(r, vec3(1.0, 0.82, 0.0), smoothstep(0.5, 0.78, t));
  return mix(r, vec3(1.0), smoothstep(0.78, 1.0, t));
}

// Canvas-space uv -> source video uv (mirror-repeat, crop, front-camera mirror)
vec2 mirrorUv(vec2 u){ return 1.0 - abs(1.0 - mod(u, 2.0)); }
vec2 toSrc(vec2 q){
  vec2 u = (mirrorUv(q) - 0.5) * uCrop + 0.5;
  if (uMirror > 0.5) u.x = 1.0 - u.x;
  return u;
}

// Sobel edge strength on luma around a source uv
float edgeAt(vec2 uv, float k){
  vec2 t = uTexel * k;
  float a = luma(texture(uTex, uv + vec2(-t.x, -t.y)).rgb), b = luma(texture(uTex, uv + vec2(0.0, -t.y)).rgb), c = luma(texture(uTex, uv + vec2(t.x, -t.y)).rgb);
  float d = luma(texture(uTex, uv + vec2(-t.x, 0.0)).rgb), f = luma(texture(uTex, uv + vec2(t.x, 0.0)).rgb);
  float g = luma(texture(uTex, uv + vec2(-t.x, t.y)).rgb), h = luma(texture(uTex, uv + vec2(0.0, t.y)).rgb), i = luma(texture(uTex, uv + vec2(t.x, t.y)).rgb);
  float gx = (c + 2.0 * f + i) - (a + 2.0 * d + g);
  float gy = (g + 2.0 * h + i) - (a + 2.0 * b + c);
  return length(vec2(gx, gy)) * 0.5;
}

// Nearest jittered cell point (animated). p in cell units. Returns the point.
vec2 voro(vec2 p, out float d1, out float d2){
  vec2 ip = floor(p), fp = fract(p), best = vec2(0.0);
  d1 = 8.0; d2 = 8.0;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    vec2 g = vec2(float(i), float(j));
    vec2 o = 0.5 + 0.45 * sin(uTime * 0.6 + 6.2831 * hash22(ip + g));
    vec2 r = g + o - fp; float d = dot(r, r);
    if (d < d1) { d2 = d1; d1 = d; best = ip + g + o; } else if (d < d2) d2 = d;
  }
  d1 = sqrt(d1); d2 = sqrt(d2);
  return best;
}

// ---- Effects ----
vec3 fxApply(int fx, vec3 c, vec2 cell, vec2 uv){
  float l = luma(c);
  float asp = uRes.x / uRes.y;
  if (fx == 1) { // Bleach Bypass
    float k = clamp((l - 0.45) * 10.0, 0.0, 1.0);
    vec3 ov = mix(2.0 * c * l, 1.0 - 2.0 * (1.0 - c) * (1.0 - l), k);
    return (mix(vec3(l), c, 0.45) * 0.3 + ov * 0.7) * 1.05;
  }
  if (fx == 2) { // Doll House: soft, pink, airy
    c = c * 1.12 + 0.05;
    c = satur(c, 1.15) * vec3(1.08, 0.95, 1.04);
    c = (c - 0.5) * 0.82 + 0.5;
    c = mix(c, vec3(1.0, 0.84, 0.92), 0.10);
    return c + max(c - 0.7, 0.0) * 0.35;
  }
  if (fx == 3) { // Jet Black: deep contrasty mono
    float m = smoothstep(0.16, 0.86, l);
    return vec3(pow(m, 1.15)) * vec3(1.0, 1.0, 1.02);
  }
  if (fx == 4) { // Teal & Orange
    vec3 tint = mix(vec3(0.62, 1.0, 1.12), vec3(1.2, 1.0, 0.78), smoothstep(0.2, 0.8, l));
    c = c * tint;
    return (c - 0.5) * 1.15 + 0.5;
  }
  if (fx == 5) { // Solarize
    vec3 s = mix(c, 1.0 - c, smoothstep(0.45, 0.55, c));
    return s * 1.8;
  }
  if (fx == 6) { // Candy
    c = satur(c, 1.55) * vec3(1.05, 0.95, 1.1) + 0.06;
    return pow(max(c, 0.0), vec3(0.85));
  }
  if (fx == 7) { // CCD: early digicam, bright, cool shadows, bloom-y highlights
    c = c * 1.25;
    c = (c - 0.5) * 1.15 + 0.5;
    c = satur(c, 1.3);
    c += vec3(-0.02, 0.0, 0.06) * (1.0 - l);
    return mix(c, vec3(1.0), smoothstep(0.85, 1.0, l) * 0.3);
  }
  if (fx == 8) { // CCD Flash: harsh direct flash
    float f = 1.0 - smoothstep(0.12, 0.95, rad());
    c = c * (0.3 + 1.15 * f);
    c = (c - 0.5) * 1.25 + 0.5;
    c = satur(c, 1.2);
    c += smoothstep(0.6, 1.0, l) * 0.15;
    c.b *= 1.04;
    return c;
  }
  if (fx == 9) { // Nokia: 4-tone green LCD with a pixel grid
    float q = floor(l * 3.999) / 3.0;
    vec3 col = mix(vec3(0.26, 0.32, 0.24), vec3(0.78, 0.94, 0.85), q);
    float grid = step(0.10, cell.x) * step(0.10, cell.y);
    return col * mix(0.82, 1.0, grid);
  }
  if (fx == 10) { // Motorola: low-res, washed, cold
    c = satur(c, 0.85) * vec3(0.97, 1.0, 1.06);
    c = (c - 0.5) * 0.9 + 0.5 + 0.03;
    return c + (nz(1.0) - 0.5) * 0.05;
  }
  if (fx == 11) { // 3GS: warm, soft, lifted blacks
    c = c * vec3(1.08, 1.03, 0.88);
    c = satur(c, 0.85);
    c = (c - 0.5) * 0.9 + 0.5 + 0.04;
    return c * (1.0 - 0.25 * smoothstep(0.4, 0.9, rad()));
  }
  if (fx == 12) { // Webcam: low-res, green-cyan, noisy
    c = c * vec3(0.92, 1.05, 1.0);
    c = satur(c, 0.75);
    c = (c - 0.5) * 0.85 + 0.5 + 0.04;
    return c + (nz(1.0) - 0.5) * 0.12;
  }
  if (fx == 13) { // Polaroid: faded, warm highlights, greenish shadows
    c = c * 0.88 + 0.10;
    c = mix(c * vec3(0.95, 1.0, 1.0), c * vec3(1.06, 1.0, 0.88), smoothstep(0.2, 0.8, l));
    c = satur(c, 0.85);
    return c * (1.0 - 0.2 * smoothstep(0.4, 0.9, rad()));
  }
  if (fx == 14) { // Disposable: warm cast, flash falloff, punchy
    c = c * vec3(1.1, 1.05, 0.85);
    c = (c - 0.5) * 1.2 + 0.5;
    c = satur(c, 1.15);
    c.g += 0.03 * (1.0 - l);
    float f = 1.0 - 0.55 * smoothstep(0.25, 0.85, rad());
    return c * f;
  }
  if (fx == 15) { // VHS: scanlines, noise bands, washed color
    c = satur(c, 0.8);
    c += vec3(0.04, 0.0, 0.05) * (1.0 - l);
    float sl = 0.88 + 0.12 * sin(vUv.y * uRes.y * 3.14159);
    float band = texture(uNoise, vec2(0.37, floor(vUv.y * 240.0) / 240.0 + uTime)).r;
    c += (band - 0.5) * 0.08;
    c = c * sl + 0.03;
    return c + smoothstep(0.7, 1.0, l) * 0.08;
  }
  if (fx == 16) { // Surveillance: green-grey, scanlines, harsh
    float m = (l - 0.5) * 1.3 + 0.5;
    float sl = 0.85 + 0.15 * sin(vUv.y * uRes.y * 3.14159);
    return vec3(0.75, 1.0, 0.8) * m * sl + (nz(1.0) - 0.5) * 0.1;
  }
  if (fx == 17) { // Thermal
    return heat(clamp((l - 0.08) * 1.15, 0.0, 1.0));
  }
  if (fx == 18) { // Night vision
    float m = pow(clamp(l * 1.8, 0.0, 1.0), 0.8);
    vec3 g = vec3(0.1, 1.0, 0.2) * m + (nz(1.0) - 0.5) * 0.2;
    float sl = 0.93 + 0.07 * sin(vUv.y * uRes.y * 3.14159);
    return g * sl * (1.0 - smoothstep(0.5, 0.85, rad()));
  }
  // ---- TouchDesigner-style ----
  if (fx == 110) { vec2 o = vec2(0.004, 0.0); return vec3(texture(uTex, uv + o).r, c.g, texture(uTex, uv - o).b); }
  if (fx == 111) { // RGB Split
    vec2 o = vec2(cos(uTime * 1.3), sin(uTime * 1.3)) * (0.006 + 0.004 * sin(uTime * 3.0));
    return vec3(texture(uTex, uv + o).r, c.g, texture(uTex, uv - o).b);
  }
  if (fx == 112) { // Neon Edges
    float e = edgeAt(uv, 1.5);
    return c * 0.18 + pal(l * 1.5 + uTime * 0.15 + e) * smoothstep(0.03, 0.25, e) * 2.2;
  }
  if (fx == 113) { // Halftone
    float s = 9.0; vec2 p = vUv * uRes / s; vec2 cl = floor(p); vec2 f = fract(p) - 0.5;
    vec3 cc = texture(uTex, toSrc((cl + 0.5) * s / uRes)).rgb;
    float r = 0.12 + 0.55 * sqrt(1.0 - luma(cc));
    return mix(vec3(0.96, 0.94, 0.90), cc * 0.7, smoothstep(r + 0.06, r - 0.06, length(f)));
  }
  if (fx == 114) { // Dither
    float B[16] = float[16](0.0, 8.0, 2.0, 10.0, 12.0, 4.0, 14.0, 6.0, 3.0, 11.0, 1.0, 9.0, 15.0, 7.0, 13.0, 5.0);
    ivec2 ip = ivec2(mod(floor(vUv * uRes / 3.0), 4.0));
    float t = (B[ip.x + 4 * ip.y] + 0.5) / 16.0;
    return mix(vec3(0.02, 0.03, 0.10), vec3(0.45, 1.0, 0.98), step(t, l));
  }
  if (fx == 115) { // ASCII
    vec2 cs = vec2(8.0, 14.0); vec2 p = vUv * uRes / cs; vec2 cl = floor(p), f = fract(p);
    vec3 cc = texture(uTex, toSrc((cl + 0.5) * cs / uRes)).rgb; float li = luma(cc);
    float gph = 0.0;
    if (li > 0.80) gph = step(abs(f.x - 0.5), 0.38) * step(abs(f.y - 0.5), 0.42);
    else if (li > 0.60) gph = max(step(abs(f.x - 0.35), 0.07), step(abs(f.x - 0.65), 0.07)) * step(abs(f.y - 0.5), 0.42) + max(step(abs(f.y - 0.35), 0.06), step(abs(f.y - 0.65), 0.06)) * step(abs(f.x - 0.5), 0.38);
    else if (li > 0.40) gph = max(step(abs(f.x - 0.5), 0.09) * step(abs(f.y - 0.5), 0.32), step(abs(f.y - 0.5), 0.07) * step(abs(f.x - 0.5), 0.32));
    else if (li > 0.22) gph = step(length(f - vec2(0.5, 0.3)), 0.1) + step(length(f - vec2(0.5, 0.7)), 0.1);
    else if (li > 0.10) gph = step(length(f - 0.5), 0.1);
    return mix(vec3(0.0, 0.02, 0.03), mix(vec3(0.25, 1.0, 0.9), cc * 1.4, 0.45), clamp(gph, 0.0, 1.0));
  }
  if (fx == 116) { // Mosaic (Voronoi)
    float N = 16.0; vec2 sz = vec2(N * asp, N); float d1, d2;
    vec2 ctr = voro(vUv * sz, d1, d2);
    vec3 cc = texture(uTex, toSrc(ctr / sz)).rgb;
    return cc * mix(0.35, 1.0, smoothstep(0.0, 0.08, d2 - d1));
  }
  if (fx == 117) { // Hex Pixels
    float S = 18.0; vec2 sz = vec2(S * asp, S); vec2 p = vUv * sz;
    vec2 r = vec2(1.0, 1.7320508); vec2 h = r * 0.5;

// Canvas-space geometry for an effect (pixelation, wobble, TD warps)
vec2 geo(int fx, vec2 q, out vec2 cell){
  float asp = uRes.x / uRes.y;
  if (fx == 15) q.x += sin(vUv.y * 30.0 + uTime * 2.0) * 0.0015 + step(0.97, fract(vUv.y * 3.0 - uTime * 0.2)) * 0.01;
  float cols = 0.0;
  if (fx == 9) cols = 84.0;
  else if (fx == 10) cols = 240.0;
  else if (fx == 12) cols = 320.0;
  else if (fx == 16) cols = 280.0;
  vec2 g = vec2(1.0);
  if (cols > 0.0) {
    g = vec2(cols, cols / asp);
    q = (floor(q * g) + 0.5) / g;
  }
  cell = fract(vUv * g);

  if (fx >= 101 && fx <= 110) {
    vec2 p = (q - 0.5) * vec2(asp, 1.0);
    float r = length(p);
    bool useP = true;
    if (fx == 101) { // Kaleidoscope
      float w = PI * 2.0 / 6.0;
      float a = mod(atan(p.y, p.x) + uTime * 0.15, w);
      a = abs(a - w * 0.5);
      p = 0.6 * r * vec2(cos(a), sin(a));
    } else if (fx == 102) { // Mirror Quad
      p = abs(p);
    } else if (fx == 103) { // Tunnel
      q = vec2(abs(atan(p.y, p.x)) / PI, 0.3 / max(r, 0.04) - uTime * 0.35); useP = false;
    } else if (fx == 104) { // Swirl

      p *= 0.55 + 0.45 * smoothstep(0.0, 1.0, r * 1.2);

  }

}

// Source sample + pre-effect adjustments (blur, sharpen, temperature, tint, highlights, shadows)
vec3 pre(vec2 uv, int fx){
  vec3 c = texture(uTex, uv).rgb;
  if (fx == 15) { // VHS chroma shift
    vec2 o = vec2(0.004, 0.0);
    c.r = texture(uTex, uv + o).r;
    c.b = texture(uTex, uv - o).b;
  }
  if (uBlur > 0.001 || uSharpness > 0.001) {
    float r = 1.0 + uBlur * 6.0;
    vec3 s = vec3(0.0);
    for (int y = -1; y <= 1; y++)
      for (int x = -1; x <= 1; x++)
        s += texture(uTex, uv + vec2(float(x), float(y)) * uTexel * r).rgb;
    s /= 9.0;
    if (uBlur > 0.001) c = mix(c, s, clamp(uBlur * 2.0, 0.0, 1.0));
    c += (c - s) * uSharpness * 2.0;

  c.g += uTint * 0.10;         c.r -= uTint * 0.04; c.b -= uTint * 0.04;

  c += uShadows * (1.0 - smoothstep(0.0, 0.5, l0)) * 0.3;
  return c;
}

// FilmCam mask brush: paint where the effect applies.
// White = effect, black = original picture. Shared by the app and the Artifact preview.

function createMask(frame, onChange) {
  const SIZE = 512;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = SIZE;
  const ctx = canvas.getContext('2d');
  const fillAll = (color) => { ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.fillStyle = color; ctx.fillRect(0, 0, SIZE, SIZE); };
  fillAll('#fff');

  // Tinted overlay shows the erased area while the mask tab is open
  const ov = document.createElement('canvas');
  ov.width = ov.height = 128;
  ov.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;image-rendering:auto';
  ov.hidden = true;
  frame.appendChild(ov);
  const octx = ov.getContext('2d', { willReadFrequently: true });

  const api = {
    canvas, version: 0, active: false, enabled: false,
    mode: 'erase',     // 'erase' | 'restore'
    tool: 'brush',     // 'brush' | 'shape'
    size: 50, opacity: 1, hardness: 0.7,
  };

  function refreshOverlay() {
    octx.clearRect(0, 0, 128, 128);
    octx.drawImage(canvas, 0, 0, 128, 128);
    const img = octx.getImageData(0, 0, 128, 128), d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const m = d[i] / 255;
      d[i] = 0; d[i + 1] = 200; d[i + 2] = 255; d[i + 3] = Math.round((1 - m) * 120);
    }
    octx.putImageData(img, 0, 0);
  }

  function changed() { api.active = true; api.version++; refreshOverlay(); onChange && onChange(); }

  // Soft disc at (cx, cy), radii in CSS px, drawn in normalized mask space
  function disc(cx, cy, rx, ry) {
    const r = frame.getBoundingClientRect();
    const col = api.mode === 'erase' ? '0,0,0' : '255,255,255';
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.translate(cx / r.width * SIZE, cy / r.height * SIZE);
    ctx.scale(SIZE / r.width, SIZE / r.height);
    ctx.scale(rx, ry);
    const inner = Math.min(api.hardness, 0.97);
    const g = ctx.createRadialGradient(0, 0, inner, 0, 0, 1);
    g.addColorStop(0, `rgba(${col},${api.opacity})`);
    g.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 1, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  let last = null, start = null, snap = null, drawing = false;
  const pos = (e) => { const b = frame.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };

  function stroke(from, to) {
    const rr = api.size / 2;
    const dist = Math.hypot(to[0] - from[0], to[1] - from[1]);
    const step = Math.max(1, rr * 0.25);
    const n = Math.max(1, Math.ceil(dist / step));
    for (let i = 1; i <= n; i++) disc(from[0] + (to[0] - from[0]) * i / n, from[1] + (to[1] - from[1]) * i / n, rr, rr);
  }

  function shape(a, b) {
    ctx.drawImage(snap, 0, 0);
    const cx = (a[0] + b[0]) / 2, cy = (a[1] + b[1]) / 2;
    disc(cx, cy, Math.max(2, Math.abs(b[0] - a[0]) / 2), Math.max(2, Math.abs(b[1] - a[1]) / 2));
  }

  frame.addEventListener('pointerdown', (e) => {
    if (!api.enabled) return;
    drawing = true; frame.setPointerCapture(e.pointerId);
    start = last = pos(e);
    if (api.tool === 'brush') { stroke(last, last); changed(); }
    else { snap = document.createElement('canvas'); snap.width = snap.height = SIZE; snap.getContext('2d').drawImage(canvas, 0, 0); }
    e.preventDefault();
  });
  frame.addEventListener('pointermove', (e) => {
    if (!api.enabled || !drawing) return;
    const p = pos(e);
    if (api.tool === 'brush') { stroke(last, p); last = p; } else shape(start, p);
    changed();
  });
  const end = () => { drawing = false; snap = null; };
  frame.addEventListener('pointerup', end);
  frame.addEventListener('pointercancel', end);

  api.invert = () => { ctx.globalCompositeOperation = 'difference'; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, SIZE, SIZE); ctx.globalCompositeOperation = 'source-over'; changed(); };
  api.reset = () => { fillAll('#fff'); api.active = false; api.version++; refreshOverlay(); onChange && onChange(); };
  api.setEnabled = (on) => { api.enabled = on; ov.hidden = !on; frame.style.touchAction = on ? 'none' : ''; if (on) refreshOverlay(); };
  refreshOverlay();
  return api;
}

  maskTex=gl.createTexture();gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,maskTex);
  [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]].forEach(a=>gl.texParameteri(gl.TEXTURE_2D,a[0],a[1]));
  gl.uniform1i(U.uTex,0);gl.uniform1i(U.uNoise,1);gl.uniform1i(U.uMask,2);
}
// Animated effects (VHS, noise) need a redraw loop; static ones draw once per change.
let pend=false;function render(){if(pend)return;pend=true;requestAnimationFrame(()=>{pend=false;draw()})}
function draw(){
  if(!src)return;
  gl.viewport(0,0,W,H);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);
  gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,maskTex);
  if(maskDirty){gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,mask.canvas);maskDirty=false}
  gl.uniform1f(U.uMaskOn,mask.active?1:0);
  gl.activeTexture(gl.TEXTURE1);
  gl.uniform2f(U.uTexel,1/W,1/H);gl.uniform2f(U.uRes,W,H);gl.uniform2f(U.uGrainOff,Math.random(),Math.random());
  gl.uniform2f(U.uCrop,1,1);gl.uniform1f(U.uMirror,0);gl.uniform1f(U.uTime,(performance.now()/1000)%1000);
  const fx=EFFECTS.find(e=>e.id===st.effect);gl.uniform1f(U.uEffect,fx?fx.n:0);
  SLIDERS.forEach(s=>gl.uniform1f(U[s[5]],st[s[0]]));
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
function setSource(el,w,h){const s=Math.min(1,1400/Math.max(w,h));W=Math.round(w*s);H=Math.round(h*s);cv.width=W;cv.height=H;src=el;render()}
// Sample scene in warm light, drawn on a 2D canvas
function sample(){
  const c=document.createElement('canvas');c.width=1200;c.height=800;const x=c.getContext('2d');
  let g=x.createLinearGradient(0,0,0,500);g.addColorStop(0,'#3b6fb6');g.addColorStop(1,'#f2c08a');x.fillStyle=g;x.fillRect(0,0,1200,800);
  x.fillStyle='#ffd97a';x.beginPath();x.arc(880,260,70,0,7);x.fill();
  x.fillStyle='#355e3b';x.beginPath();x.moveTo(0,520);for(let i=0;i<=12;i++)x.lineTo(i*100,430+(i%3)*50-(i%2)*30);x.lineTo(1200,800);x.lineTo(0,800);x.fill();
  x.fillStyle='#b5482f';x.fillRect(180,360,260,200);x.fillStyle='#6b2a1c';x.beginPath();x.moveTo(160,360);x.lineTo(310,260);x.lineTo(460,360);x.fill();
  x.fillStyle='#f0e2b6';x.fillRect(260,430,60,130);x.fillRect(350,400,60,60);
  x.fillStyle='#2a3a52';x.fillRect(0,640,1200,160);
  x.fillStyle='#e8e2d4';for(let i=0;i<6;i++){x.fillRect(80+i*190,700,110,12)}
  x.fillStyle='#d0556e';x.beginPath();x.arc(760,560,46,0,7);x.fill();x.fillStyle='#e8c9a4';x.beginPath();x.arc(760,500,28,0,7);x.fill();
  setSource(c,c.width,c.height);
}
const rows=$('sliders');
SLIDERS.forEach(([id,label,mn,mx])=>{
  const r=document.createElement('div');r.className='row';
  r.innerHTML='<label for="s-'+id+'">'+label+'</label><input type="range" id="s-'+id+'" min="'+mn+'" max="'+mx+'" step="0.01"><span class="v"></span>';
  rows.appendChild(r);const i=r.querySelector('input'),v=r.querySelector('.v');
  r._s=()=>{i.value=st[id];v.textContent=(+st[id]).toFixed(2)};r._s();
  i.addEventListener('input',()=>{st[id]=parseFloat(i.value);r._s();render()});
});
const box=$('fxList');let tab='presets';
function addChip(id,name){const b=document.createElement('button');b.className='chip'+(id===st.effect?' on':'');b.textContent=name;b.dataset.fx=id;
  b.addEventListener('click',()=>{st.effect=id;box.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.fx===id));render()});box.appendChild(b)}
function buildChips(){
  box.innerHTML='';addChip('none','Original');let grp='';
  EFFECTS.filter(e=>e.tab===tab&&!e.fb).forEach(e=>{if(e.group!==grp){grp=e.group;const s=document.createElement('span');s.className='sep';s.textContent=grp;box.appendChild(s)}addChip(e.id,e.name)});
}
function setTab(n){
  tab=n;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===n));
  const isMask=n==='mask';box.hidden=isMask;$('maskPanel').hidden=!isMask;mask.setEnabled(isMask);
  if(!isMask)buildChips();
}
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
buildChips();
(function(){
  const seg=(id,attr,key)=>document.querySelectorAll('#'+id+' button').forEach(b=>b.addEventListener('click',()=>{mask[key]=b.dataset[attr];document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.toggle('on',x===b))}));
  seg('mMode','m','mode');seg('mTool','tool','tool');
  const sl=(id,key,sc)=>{const i=$(id),v=$(id+'V');const f=()=>{mask[key]=parseFloat(i.value)/sc;v.textContent=i.value};i.addEventListener('input',f);f()};
  sl('mSize','size',1);sl('mOpacity','opacity',100);sl('mHard','hardness',100);
  $('mInvert').addEventListener('click',()=>mask.invert());$('mReset').addEventListener('click',()=>mask.reset());
  const ring=document.createElement('div');ring.className='ring';ring.hidden=true;frameEl.appendChild(ring);
  const mv=e=>{if(!mask.enabled||mask.tool!=='brush'){ring.hidden=true;return}const b=frameEl.getBoundingClientRect();ring.style.width=ring.style.height=mask.size+'px';ring.style.left=e.clientX-b.left+'px';ring.style.top=e.clientY-b.top+'px';ring.hidden=false};
  frameEl.addEventListener('pointerdown',mv);frameEl.addEventListener('pointermove',mv);frameEl.addEventListener('pointerup',()=>{ring.hidden=true});frameEl.addEventListener('pointerleave',()=>{ring.hidden=true});
})();
$('reset').addEventListener('click',()=>{SLIDERS.forEach(s=>st[s[0]]=s[4]);rows.querySelectorAll('.row').forEach(r=>r._s());render()});
$('file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const im=new Image();im.onload=()=>{setSource(im,im.naturalWidth,im.naturalHeight);$('hint').textContent='Showing your photo. It is processed in your browser only.'};
  im.onerror=()=>{$('hint').textContent='Could not open the file. Choose a JPEG or PNG.'};
  im.src=URL.createObjectURL(f);
});
// Keep animated effects (VHS bands, noise) alive
setInterval(()=>{if((EFFECTS.find(e=>e.id===st.effect)||{n:0}).n>=100||['vhs','webcam','surveillance','nightvision','motorola'].includes(st.effect))render()},100);
try{init();sample()}catch(e){$('hint').textContent='WebGL2 is not available: '+e.message}
