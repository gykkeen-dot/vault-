<title>FilmCam Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: screen and buttons are pinned on top, sliders scroll beneath */
:root{--bg1:#e6eaed;--panel:#f8f9fa;--white:#fff;--line:#c4cacf;--ink:#1b1f23;--mute:#6f7880;--signal:#00c8ff;--signal-ink:#0086c3;--glow:rgba(0,200,255,.55);--ok:#2fbf71;--screen:#050607;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;color-scheme:light}
body{background:var(--bg1);color:var(--ink);font:13px/1.35 var(--mono);padding-block:0 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg1);z-index:10}
.wrap{max-width:720px;margin:0 auto}
.dock{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg1);padding:8px 0 12px}
.hud{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding:0 2px 10px}
.hud b{font:600 15px var(--cond);letter-spacing:.22em;color:var(--ink)}
.led{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok);margin-right:8px}
.frame{position:relative;background:var(--screen);border-radius:10px;overflow:hidden;display:flex;justify-content:center;box-shadow:0 0 0 6px var(--panel),0 0 0 7px var(--line),0 8px 22px rgba(30,40,50,.18);margin:0 6px}
canvas{max-width:100%;max-height:42vh;display:block}
.cn{position:absolute;width:16px;height:16px;border:0 solid var(--signal);pointer-events:none}
.tl{top:8px;left:8px;border-top-width:2px;border-left-width:2px}.tr{top:8px;right:8px;border-top-width:2px;border-right-width:2px}
.bl{bottom:8px;left:8px;border-bottom-width:2px;border-left-width:2px}.br{bottom:8px;right:8px;border-bottom-width:2px;border-right-width:2px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.btn{background:var(--signal);color:#03202b;border:0;border-radius:8px;padding:10px 16px;font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 14px var(--glow)}
button.ghost{background:var(--white);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font:11px var(--mono);letter-spacing:.14em;cursor:pointer}
.tg{display:flex;gap:6px;align-items:center;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.tg input{accent-color:var(--signal)}
button:focus-visible,input:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.hint{color:var(--mute);font-size:11px;letter-spacing:.04em;margin:0 0 12px}
.panel{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px 28px}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.row .v{text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:#cfd5d9}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#cfd5d9}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:22px;margin-top:-9px;border-radius:3px;background:var(--white);border:1px solid #98a1a8;box-shadow:0 1px 2px rgba(0,0,0,.3),inset 0 -3px 0 var(--signal),0 0 6px var(--glow)}
input[type=range]::-moz-range-thumb{width:12px;height:20px;border-radius:3px;background:var(--white);border:1px solid #98a1a8;box-shadow:0 1px 2px rgba(0,0,0,.3),inset 0 -3px 0 var(--signal),0 0 6px var(--glow)}
#file{display:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--white);border-radius:8px;padding:7px 10px;font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);cursor:pointer}
.chip.on{border-color:var(--signal);color:var(--signal-ink);font-weight:600;box-shadow:0 0 8px var(--glow)}
.chips .sep{flex:none;align-self:center;font-size:9px;letter-spacing:.18em;color:var(--mute);text-transform:uppercase;padding:0 2px 0 6px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<div class="wrap">
  <div class="dock">
    <div class="hud"><span><i class="led"></i><b>FILMCAM</b></span><span>Effects preview</span></div>
    <div class="frame"><canvas id="c"></canvas><i class="cn tl"></i><i class="cn tr"></i><i class="cn bl"></i><i class="cn br"></i></div>
    <div class="bar">
      <label class="btn" for="file">Choose photo</label><input type="file" id="file" accept="image/*">
      <button class="ghost" id="reset">RESET</button>
    </div>
    <div class="chips" id="fxList"></div>
  </div>
  <p class="hint" id="hint">Showing a sample. The live camera runs in the app itself (filmcam/ folder), not here.</p>
  <div class="panel" id="sliders"></div>
</div>
<script>
/*SHADER*/
const st={effect:'bleach'};SLIDERS.forEach(s=>st[s[0]]=s[4]);
const $=id=>document.getElementById(id), cv=$('c');
const gl=cv.getContext('webgl2',{preserveDrawingBuffer:true,antialias:false});
let U={},src=null,tex,W=1,H=1;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o}
function init(){
  const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,VERT));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,FRAG));gl.linkProgram(p);gl.useProgram(p);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const l=gl.getAttribLocation(p,'aPos');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
  for(let i=0;i<gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);i++){const n=gl.getActiveUniform(p,i).name;U[n]=gl.getUniformLocation(p,n)}
  tex=gl.createTexture();gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);
  [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]].forEach(a=>gl.texParameteri(gl.TEXTURE_2D,a[0],a[1]));
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  const d=new Uint8Array(65536);for(let i=0;i<d.length;i++)d[i]=Math.random()*256;
  const n=gl.createTexture();gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,n);gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.R8,256,256,0,gl.RED,gl.UNSIGNED_BYTE,d);gl.pixelStorei(gl.UNPACK_ALIGNMENT,4);
  [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.REPEAT],[gl.TEXTURE_WRAP_T,gl.REPEAT]].forEach(a=>gl.texParameteri(gl.TEXTURE_2D,a[0],a[1]));
  gl.uniform1i(U.uTex,0);gl.uniform1i(U.uNoise,1);
}
// Animated effects (VHS, noise) need a redraw loop; static ones draw once per change.
let pend=false;function render(){if(pend)return;pend=true;requestAnimationFrame(()=>{pend=false;draw()})}
function draw(){
  if(!src)return;
  gl.viewport(0,0,W,H);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);
  gl.activeTexture(gl.TEXTURE1);
  gl.uniform2f(U.uTexel,1/W,1/H);gl.uniform2f(U.uRes,W,H);gl.uniform2f(U.uGrainOff,Math.random(),Math.random());
  gl.uniform2f(U.uCrop,1,1);gl.uniform1f(U.uMirror,0);gl.uniform1f(U.uTime,(performance.now()/1000)%1000);
  const fx=EFFECTS.find(e=>e.id===st.effect);gl.uniform1f(U.uEffect,fx?fx.n:0);
  SLIDERS.forEach(s=>gl.uniform1f(U[s[5]],st[s[0]]));
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
function setSource(el,w,h){const s=Math.min(1,1400/Math.max(w,h));W=Math.round(w*s);H=Math.round(h*s);cv.width=W;cv.height=H;src=el;render()}
// Sample scene in warm light, drawn on a 2D canvas
function sample(){
  const c=document.createElement('canvas');c.width=1200;c.height=800;const x=c.getContext('2d');
  let g=x.createLinearGradient(0,0,0,500);g.addColorStop(0,'#3b6fb6');g.addColorStop(1,'#f2c08a');x.fillStyle=g;x.fillRect(0,0,1200,800);
  x.fillStyle='#ffd97a';x.beginPath();x.arc(880,260,70,0,7);x.fill();
  x.fillStyle='#355e3b';x.beginPath();x.moveTo(0,520);for(let i=0;i<=12;i++)x.lineTo(i*100,430+(i%3)*50-(i%2)*30);x.lineTo(1200,800);x.lineTo(0,800);x.fill();
  x.fillStyle='#b5482f';x.fillRect(180,360,260,200);x.fillStyle='#6b2a1c';x.beginPath();x.moveTo(160,360);x.lineTo(310,260);x.lineTo(460,360);x.fill();
  x.fillStyle='#f0e2b6';x.fillRect(260,430,60,130);x.fillRect(350,400,60,60);
  x.fillStyle='#2a3a52';x.fillRect(0,640,1200,160);
  x.fillStyle='#e8e2d4';for(let i=0;i<6;i++){x.fillRect(80+i*190,700,110,12)}
  x.fillStyle='#d0556e';x.beginPath();x.arc(760,560,46,0,7);x.fill();x.fillStyle='#e8c9a4';x.beginPath();x.arc(760,500,28,0,7);x.fill();
  setSource(c,c.width,c.height);
}
const rows=$('sliders');
SLIDERS.forEach(([id,label,mn,mx])=>{
  const r=document.createElement('div');r.className='row';
  r.innerHTML='<label for="s-'+id+'">'+label+'</label><input type="range" id="s-'+id+'" min="'+mn+'" max="'+mx+'" step="0.01"><span class="v"></span>';
  rows.appendChild(r);const i=r.querySelector('input'),v=r.querySelector('.v');
  r._s=()=>{i.value=st[id];v.textContent=(+st[id]).toFixed(2)};r._s();
  i.addEventListener('input',()=>{st[id]=parseFloat(i.value);r._s();render()});
});
const box=$('fxList');
function addChip(id,name){const b=document.createElement('button');b.className='chip';b.textContent=name;b.dataset.fx=id;
  b.addEventListener('click',()=>{st.effect=id;box.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.fx===id));render()});box.appendChild(b)}
let grp='';addChip('none','Original');
EFFECTS.forEach(e=>{if(e.group!==grp){grp=e.group;const s=document.createElement('span');s.className='sep';s.textContent=grp;box.appendChild(s)}addChip(e.id,e.name)});
box.querySelector('[data-fx="'+st.effect+'"]').classList.add('on');
$('reset').addEventListener('click',()=>{SLIDERS.forEach(s=>st[s[0]]=s[4]);rows.querySelectorAll('.row').forEach(r=>r._s());render()});
$('file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const im=new Image();im.onload=()=>{setSource(im,im.naturalWidth,im.naturalHeight);$('hint').textContent='Showing your photo. It is processed in your browser only.'};
  im.onerror=()=>{$('hint').textContent='Could not open the file. Choose a JPEG or PNG.'};
  im.src=URL.createObjectURL(f);
});
// Keep animated effects (VHS bands, noise) alive
setInterval(()=>{if(['vhs','webcam','surveillance','nightvision','motorola'].includes(st.effect))render()},100);
try{init();sample()}catch(e){$('hint').textContent='WebGL2 is not available: '+e.message}
</script>
