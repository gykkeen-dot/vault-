<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e6eaed">
<title>FilmCam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="console">
  <header class="hud">
    <span><i class="led"></i><b>FILMCAM</b></span>
    <span id="perf">SYSTEM READY</span>
  </header>

  <section class="viewport" id="vp">
    <div class="frame" id="frame">
      <canvas id="view"></canvas>
      <i class="cn tl"></i><i class="cn tr"></i><i class="cn bl"></i><i class="cn br"></i>
      <div class="readout" id="readout"></div>
      <div class="count" id="count" hidden></div>
      <div class="status" id="status" hidden></div>
    </div>
  </section>

  <section class="deck">
    <div class="drawer" id="panel" hidden>
      <div class="tabs" id="tabs">
        <button data-tab="presets" class="on">PRESETS</button><button data-tab="touch">TOUCH</button><button data-tab="adjust">ADJUST</button><button data-tab="mask">MASK</button>
      </div>
      <div id="pane-presets"><div class="chips" id="fxPresets"></div></div>
      <div id="pane-touch" hidden><div class="chips" id="fxTouch"></div></div>
      <div id="pane-adjust" hidden>
        <div class="drawer-head">
          <label><input type="checkbox" id="eco"> Eco</label>
          <button id="reset" class="link">RESET</button>
        </div>
        <div id="sliders"></div>
      </div>
      <div id="pane-mask" hidden>
        <p class="hint">Paint on the picture. Erase shows the original, Restore brings the effect back.</p>
        <div class="maskrow">
          <div class="group"><span class="lab">Mode</span>
            <div class="seg" id="mMode"><button data-m="erase" class="on">ERASE</button><button data-m="restore">RESTORE</button></div></div>
          <div class="group"><span class="lab">Tool</span>
            <div class="seg" id="mTool"><button data-tool="brush" class="on">BRUSH</button><button data-tool="shape">SHAPE</button></div></div>
        </div>
        <div class="row"><label for="mSize">Size</label><input type="range" id="mSize" min="5" max="150" value="50"><span class="v" id="mSizeV">50</span></div>
        <div class="row"><label for="mOpacity">Opacity</label><input type="range" id="mOpacity" min="0" max="100" value="100"><span class="v" id="mOpacityV">100</span></div>
        <div class="row"><label for="mHard">Hardness</label><input type="range" id="mHard" min="0" max="100" value="70"><span class="v" id="mHardV">70</span></div>
        <div class="maskrow">
          <button id="mInvert" class="link">INVERT</button><button id="mReset" class="link">RESET MASK</button>
        </div>
      </div>
    </div>

    <div class="rack">
      <div class="group"><span class="lab">Zoom</span>
        <div class="seg" id="zoomSeg">
          <button data-zoom="0.5">0.5</button><button data-zoom="1" class="on">1×</button><button data-zoom="2">2×</button><button data-zoom="3">3×</button>
        </div></div>
      <div class="group"><span class="lab">Camera</span>
        <div class="seg" id="camSeg">
          <button data-cam="environment" class="on">BACK</button><button data-cam="user">FRONT</button>
        </div></div>
      <div class="group"><span class="lab">Frame</span>
        <div class="seg" id="arSeg">
          <button data-ar="9:16" class="on">9:16</button><button data-ar="4:3">4:3</button><button data-ar="1:1">1:1</button>
        </div></div>
      <div class="group"><span class="lab">Timer</span>
        <div class="seg" id="timerSeg">
          <button data-t="0" class="on">OFF</button><button data-t="3">3S</button><button data-t="10">10S</button>
        </div></div>
    </div>

    <div class="main">
      <button id="panelBtn" class="side" aria-label="Effects and sliders">FX</button>
      <button id="shutter" class="shutter" aria-label="Take photo" disabled></button>
      <a id="thumbLink" class="side thumb" aria-label="Last photo"><span>PHOTO</span><img id="thumb" alt=""></a>
    </div>
  </section>
</div>

<div id="start" class="start">
  <h1>FILMCAM</h1>
  <p>Film camera. Camera access is required.</p>
  <button id="startBtn">START</button>
</div>

<script src="app.js" type="module"></script>
</body>
</html>
